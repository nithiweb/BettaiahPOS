name: Build offline Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Check environment
        run: flutter doctor -v
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name bettaiah_pos --org com.bettaiah .
      - name: Get packages
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build universal APK
        run: flutter build apk --release
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bettaiah-POS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
